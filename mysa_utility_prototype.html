<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mysa · Utility payments prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: Mysa app shell — fixed dark sidebar + working area (filters, summary, grouped table, floating selection bar).
   Single light theme, matching Mysa's product UI. */
:root{
 --sidebar:#0A1C1A; --nav-text:#FDFDFD; --nav-active:#00C2AC; --nav-hover:#16302D;
 --surface:#FDFDFD; --white:#FFFFFF; --ink:#18181A; --ink-2:#52525B; --muted:#71717A; --faint:#A1A1AA;
 --line:#EFEFF0; --border:#D4D4D7; --border-2:#E4E4E7; --head:#FAFAFA; --group:#F4F4F5;
 --primary:#007466; --focus:#009B8A; --sel:#E4F9F7; --hl:#F0FBF9;
 --bar-1:#1D4ED8; --bar-2:#009B8A; --bar-3:#EAB308; --bar-sel:#2563EB;
 --link:#2563EB; --info:#006999; --info-bg:#E0F5FF; --info-track:#BFE6F7; --ok-bg:#CCEBE8;
 --dark:#091C1A; --dark-btn:#52525B; --scrim:rgba(0,0,0,.35);
 --font:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--surface);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
svg{display:block}
.app{display:flex;height:100%}
/* sidebar */
.side{width:200px;flex:0 0 200px;background:var(--sidebar);padding:24px 8px 0;display:flex;flex-direction:column;overflow-y:auto}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 0 0 8px;border-radius:4px;font-size:14px;font-weight:500;color:var(--nav-text);width:100%;text-align:left;margin-bottom:4px}
.nav:hover{background:var(--nav-hover)}
.nav svg{width:18px;height:18px;stroke:currentColor}
.nav.on{color:var(--nav-active)}
.nav .chev{margin-left:auto;margin-right:10px;width:14px;height:14px}
.sub{display:block;height:32px;padding:0 0 0 38px;border-radius:4px;font-size:13px;font-weight:500;color:var(--nav-text);width:100%;text-align:left}
.sub:hover{background:var(--nav-hover)}
.sub.on{color:var(--nav-active)}
.keep{margin-top:auto;display:flex;align-items:center;gap:10px;padding:16px 8px 22px;font-size:14px;color:var(--nav-text)}
.keep svg{width:14px;height:14px;stroke:currentColor}
/* main */
.main{flex:1;min-width:0;overflow-y:auto;padding-block:16px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;min-height:30px}
.title{font-size:18px;font-weight:500;line-height:28px;color:#000;margin:0}
.guides{display:inline-flex;align-items:center;gap:6px;height:30px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-size:14px;color:var(--ink-2)}
.guides svg{width:10px;height:10px;fill:var(--ink-2)}
.tic{margin-left:auto;display:flex;align-items:center;gap:18px}
.tic svg{width:19px;height:19px;stroke:var(--ink-2)}
.tic .sync svg{stroke:var(--bar-sel)}
.avc{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-2);background:var(--head);font-size:12px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.fbar{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.flbl{font-size:14px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--white);font-size:14px;color:var(--ink)}
.cbx{width:13px;height:13px;border:1px solid #767676;border-radius:2px;background:var(--white);display:inline-block;position:relative;flex:0 0 13px}
.cbx.on{background:var(--ink);border-color:var(--ink)}
.cbx.on::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;border:solid var(--white);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.cbx.part{background:var(--ink);border-color:var(--ink)}
.cbx.part::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1.6px;background:var(--white)}
.vsep{width:1px;height:30px;background:var(--border);margin:0 2px}
.more{display:inline-flex;align-items:center;gap:6px;height:30px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--ink-2);background:var(--surface)}
.more svg,.sortb svg{width:14px;height:14px;stroke:var(--ink-2)}
.fcount{background:#29272A;color:var(--white);border-radius:16px;font-size:10px;font-weight:500;padding:1px 6px}
.sortwrap{margin-left:auto;position:relative}
.sortb{display:inline-flex;align-items:center;gap:4px;height:30px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-size:14px;color:var(--ink-2)}
.sortb b{font-weight:400;color:var(--ink)}
.sortb[aria-expanded="true"]{border-color:var(--focus)}
.menu{position:absolute;right:0;top:36px;z-index:20;width:240px;background:var(--white);border:1px solid var(--border);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.06);padding:4px}
.mi{display:flex;align-items:center;width:100%;height:36px;padding:8px 12px;border-radius:4px;font-size:14px;color:var(--ink);text-align:left}
.mi:hover{background:var(--group)}
.mi.sel{background:var(--sel)}
.mi svg{margin-left:auto;width:15px;height:15px;stroke:var(--ink)}
.mdiv{height:1px;background:var(--border-2);margin:4px 0}
.msave{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px 6px;border-top:1px solid var(--border-2);margin-top:4px;font-size:14px;color:var(--ink)}
.applied{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.achip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:2px 8px;border-radius:4px;background:var(--sel);border:1px solid #9FDDD5;font-size:13px;color:var(--ink)}
.achip svg{width:12px;height:12px;stroke:var(--ink-2)}
.link{color:var(--bar-sel);font-size:13px}
.sumrow{display:flex;align-items:center;flex-wrap:wrap;gap:16px 0;margin-top:18px}
.sum{display:flex;align-items:center;gap:13px;margin-right:46px}
.sum .bar{width:2px;height:35px}
.sum .l{font-size:12px;font-weight:300;color:var(--muted);line-height:16px}
.sum .v{font-size:16px;color:#000;line-height:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lastr{font-size:12px;font-weight:300;color:var(--muted)}
.obtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:9px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-size:14px;color:var(--ink-2)}
.obtn svg{width:16px;height:16px;stroke:var(--ink-2)}
.obtn[disabled]{color:var(--faint);cursor:default}
.banner{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--info-bg);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--info)}
.track{flex:1;height:6px;background:var(--info-track);border-radius:3px;overflow:hidden;min-width:80px}
.track span{display:block;height:100%;background:var(--info);transition:width .25s}
/* table */
.tscroll{margin-top:18px;overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.tbl{min-width:100%;width:max-content;background:var(--surface)}
.tr{background:var(--surface);display:flex;min-height:41px;border-bottom:1px solid var(--line);align-items:stretch;transition:background .6s}
.tr:last-child{border-bottom:none}
.tr.hd{background:var(--head)}
.c{display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--line);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.c:last-child{border-right:none}
.hd .c{font-size:12px;font-weight:500;color:var(--ink-2);text-transform:uppercase;gap:6px;letter-spacing:.01em}
.hd .c svg{width:12px;height:12px;stroke:var(--muted)}
.r{justify-content:flex-end}
.tr.sel{background:var(--sel)}
.tr.flash{background:var(--hl)}
.tr.grp{background:var(--group);cursor:pointer}
.tr.grp .c{font-weight:500}
.tr.grp .c.span{border-right:none}
.w-cb{width:44px;flex:0 0 44px}.w-acc{width:260px;flex:1 0 260px}.w-ent{width:115px;flex:0 0 115px}.w-cat{width:98px;flex:0 0 98px}.w-br{width:88px;flex:0 0 88px}.w-cur{width:150px;flex:0 0 150px}.w-av{width:150px;flex:0 0 150px}.w-sync{width:190px;flex:0 0 190px}.w-accno{width:190px;flex:0 0 190px}.w-ifsc{width:130px;flex:0 0 130px}.w-act{width:96px;flex:0 0 96px;position:sticky;right:0;z-index:1;background:inherit;border-left:1px solid var(--line)}
.hd .w-act{gap:8px}
.colbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:none;border:0;padding:0;cursor:pointer}.colbtn svg{width:15px!important;height:15px!important;stroke:var(--ink-2)!important}.colbtn:hover,.colbtn.on{background:var(--group)}
.cpop{position:fixed;z-index:45;width:340px;max-width:calc(100vw - 16px);background:var(--white);border:1px solid var(--border);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.1);display:flex;flex-direction:column}
.cpop .cs{position:relative;margin:16px 16px 0}.cpop .cs input{width:100%;height:42px;border:1px solid var(--border);border-radius:4px;padding:0 40px 0 14px;font:inherit;font-size:14px;color:var(--ink)}.cpop .cs input::placeholder{color:var(--faint)}.cpop .cs svg{position:absolute;right:12px;top:12px;width:18px;height:18px;stroke:var(--ink-2)}
.cpop .crow{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 10px;font-size:14px;color:var(--ink)}.cpop .crow .link{font-size:14px;color:var(--link)}
.cpop .cnote{margin:0 4px;background:var(--group);border:1px solid var(--border-2);padding:8px 10px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.cpop .clist{max-height:260px;overflow-y:auto;padding:10px 0}
.cpop .copt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 24px;background:none;border:0;font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}.cpop .copt:hover{background:var(--head)}
.cpop .copt .cbx{width:16px;height:16px;flex-basis:16px}.cpop .copt .cbx.on::after{left:4.5px;top:1.5px;width:4.5px;height:8px}
.cpop .copt.lock{color:var(--faint);cursor:default}.cpop .copt.lock .cbx{background:var(--faint);border-color:var(--faint)}.cpop .copt.lock:hover{background:none}
.cpop .cempty{padding:12px 24px;font-size:14px;color:var(--muted)}
.cpop .cfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.cpop .cfoot button{flex:1;justify-content:center;height:40px}

.av.lg{background:var(--white)}.av.lg img{width:16px;height:16px;object-fit:contain;display:block}
.av{width:24px;height:24px;border-radius:50%;background:var(--head);border:1px solid var(--border-2);font-size:10px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;margin-right:10px;flex:0 0 24px}
.subt{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.gchev{width:14px;height:14px;stroke:var(--ink-2);margin-right:8px;flex:0 0 14px}
.ib{width:32px;height:32px;border:1px solid var(--border-2);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;margin-left:6px}
.ib svg{width:15px;height:15px;stroke:var(--ink-2)}
.xl{position:relative;width:28px;height:28px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;border-radius:4px;cursor:pointer;padding:0}
.xl svg{width:16px;height:16px;stroke:var(--link)}
.xl:hover{background:var(--hl)}
.tipx{position:fixed;z-index:50;white-space:nowrap;background:var(--ink);color:var(--white);font-size:12px;line-height:1.3;padding:6px 8px;border-radius:4px;pointer-events:none}
.rmenu{position:fixed;z-index:40;min-width:180px;background:var(--white);border:1px solid var(--border);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.08);padding:4px}
.rmenu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:14px;color:var(--ink);padding:8px 10px;border-radius:4px;cursor:pointer}
.rmenu button:hover{background:var(--group)}
.ib.on{border-color:var(--border);background:var(--group)}
.rf{width:22px;height:22px;border:1px solid var(--border-2);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;margin-left:8px;flex:0 0 22px}
.rf svg{width:12px;height:12px;stroke:var(--ink-2)}
.rf:hover,.ib:hover{border-color:var(--border)}
.glink{display:inline-flex;align-items:center;font-size:13px;color:var(--ink-2);font-weight:400}
.muted{color:var(--muted)}
.okt{color:var(--primary);font-weight:500}
.spin{width:12px;height:12px;border:2px solid var(--ok-bg);border-top-color:var(--primary);border-radius:50%;margin-right:8px;flex:0 0 12px;animation:sp .8s linear infinite}
.banner .spin{border-color:var(--info-track);border-top-color:var(--info);margin:0}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.tr{transition:none}}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
/* selection bar */
.abar{position:fixed;left:200px;right:0;margin-inline:auto;width:max-content;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:20px;background:var(--dark);border-radius:8px;padding:12px 12px 12px 16px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);max-width:calc(100vw - 32px);flex-wrap:wrap}
.abar .x svg{width:14px;height:14px;stroke:var(--faint)}
.abar .s{display:flex;align-items:center;gap:12px}
.abar .s .bar{width:2px;height:35px}
.abar .l{font-size:12px;font-weight:300;color:var(--faint)}.abar .v{font-size:16px;color:var(--white);margin-top:2px;font-variant-numeric:tabular-nums}
.dk{display:inline-flex;align-items:center;gap:6px;height:38px;padding:9px 12px;border-radius:4px;background:var(--dark-btn);color:var(--white);font-size:14px}
.dk svg,.pr svg{width:15px;height:15px;stroke:var(--white)}
.pr{display:inline-flex;align-items:center;gap:6px;height:38px;padding:9px 14px;border-radius:4px;background:var(--primary);color:var(--surface);font-size:14px}
.pr[disabled]{opacity:.6;cursor:default}
/* toast */
.toast{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;background:var(--dark);color:var(--white);border-radius:8px;padding:12px 16px;font-size:14px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);max-width:calc(100vw - 32px)}
.toast .ic{width:18px;height:18px;border-radius:50%;background:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 18px}
.abar:not([hidden])~.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:100px 16px 16px}
.modal{width:640px;max-width:100%;background:var(--white);border-radius:6px;box-shadow:0 10px 25px rgba(0,0,0,.15);display:flex;flex-direction:column;max-height:calc(100vh - 140px)}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-2);font-size:18px;font-weight:500;color:var(--ink)}
.mh button{margin-left:auto}.mh svg{width:18px;height:18px;stroke:var(--ink-2)}
.mb{display:flex;min-height:300px;overflow:hidden}
.mcat{width:180px;flex:0 0 180px;border-right:1px solid var(--border-2);padding:10px;overflow-y:auto}
.mcat button{display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-radius:4px;font-size:14px;color:#3F3F46;text-align:left}
.mcat button.on{background:var(--sel);color:var(--ink)}
.mcat .n{font-size:11px;color:var(--primary);font-weight:600}
.mopt{flex:1;padding:14px 18px;overflow-y:auto;min-width:0}
.msearch{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink)}
.mrow{display:flex;justify-content:space-between;margin:12px 0 6px;font-size:14px;color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;color:var(--ink);width:100%;text-align:left}
.opt .cnt{margin-left:auto;color:var(--faint);font-size:12px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-2)}
.example{font-size:11.5px;color:var(--faint);margin-left:8px}
@media (max-width:900px){.side{display:none}.abar{left:0}.sortwrap{margin-left:0}}
.bsq{display:flex;align-items:center;gap:8px;height:30px;width:340px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--white);margin-right:8px}
.bsq svg{width:15px;height:15px;stroke:var(--ink-2);flex:0 0 15px}.bsq input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:none}.bsq input::placeholder{color:var(--faint)}
.sub{cursor:pointer}
@media (max-width:900px){.bsq{width:100%;margin:0 0 8px}.fbar{flex-wrap:wrap}}

#vStmt .w-desc{width:280px;flex:1 0 280px}

.rvtag{font-size:12.5px;color:#52525B;background:#F4F4F5;border-radius:6px;padding:9px 12px;margin-top:12px;display:flex;align-items:center;gap:6px}
.rvitbl,.rvps{border:1px solid #EFEFF0;border-radius:8px;overflow:hidden;margin-top:4px}
.rvit{display:grid;grid-template-columns:40px 1fr 160px 120px;padding:10px 14px;font-size:13px;border-top:1px solid #F4F4F5}
.rvit.hd{background:#FAFAFA;color:#71717A;font-weight:500;border-top:0;text-transform:uppercase;font-size:11px;letter-spacing:.02em}
.rvpr{display:flex;justify-content:space-between;padding:11px 16px;font-size:14px;border-top:1px solid #F4F4F5}
.rvps .rvpr:first-child{border-top:0}
.rvpr-net{font-weight:600;color:#18181A}
.rvdocrow{display:flex;align-items:center;gap:12px;border:1px solid #EFEFF0;border-radius:8px;padding:12px 14px;font-size:14px}
.rvdocrow .grow{flex:1}.rvdocrow small{display:block;font-size:12px;color:#71717A}.rvdocrow svg{width:18px;height:18px}
.rvcmt{display:flex;border:1px solid #D4D4D7;border-radius:8px;overflow:hidden;margin-top:4px}
.rvcmt input{flex:1;border:0;outline:0;font:inherit;font-size:14px;padding:11px 14px}
.rvc-send{border:0;border-left:1px solid #EFEFF0;background:#FAFAFA;font:inherit;font-size:13px;color:#52525B;padding:0 16px;cursor:pointer}
.rvcmt-list{margin-top:16px}.rvcm{display:flex;gap:10px;font-size:13px}.rvcm b{font-size:13px}.rvcm-t{color:#A1A1AA;font-size:12px;margin-left:6px}.rvcm p{margin:4px 0 0;color:#3F3F46;line-height:18px}
.rvtl{display:flex;align-items:center;padding:6px 0 10px}
.rvtl-s{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.rvtl-d{width:18px;height:18px;border-radius:50%;border:2px solid #D4D4D7;box-sizing:border-box;background:#fff;display:flex;align-items:center;justify-content:center}
.rvtl-d.done{background:#10B981;border-color:#10B981}.rvtl-d.cur{border-color:#2563EB}.rvtl-d.cur::after{content:"";width:8px;height:8px;border-radius:50%;background:#2563EB}
.rvtl-l{font-size:12px;color:#18181A;white-space:nowrap}.rvtl-l.pd{color:#A1A1AA}
.rvtl-ln{flex:1;height:2px;background:#E4E4E7;margin:0 8px;margin-bottom:22px;border-radius:2px}.rvtl-ln.done{background:#10B981}
/* bill document preview */
.rvdoc{width:100%;max-width:560px}
.rvpaper{background:#fff;border:1px solid #EFEFF0;border-radius:4px;padding:28px 30px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rvp-hd{display:flex;align-items:flex-start;justify-content:space-between}
.rvp-bill{font-size:22px;font-weight:700;letter-spacing:.04em;color:#18181A}.rvp-no{font-size:12px;color:#71717A;margin-top:2px}
.rvp-rule{height:3px;background:#18181A;margin:14px 0 16px;border-radius:2px}
.rvp-parties{display:flex;justify-content:space-between;gap:24px}
.rvp-lbl{font-size:11px;color:#A1A1AA;margin-bottom:3px}.rvp-v{font-size:13px;font-weight:600;color:#18181A;max-width:220px}.rvp-s{font-size:12px;color:#71717A;margin-top:2px}
.rvp-dates{display:flex;gap:40px;margin:18px 0}.rvp-v2{font-size:13px;color:#18181A}
.rvp-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.rvp-tbl th{font-size:11px;color:#71717A;font-weight:500;text-align:center;padding:8px 6px;border-bottom:1px solid #EFEFF0}
.rvp-tbl td{font-size:12.5px;color:#18181A;text-align:center;padding:10px 6px;border-bottom:1px solid #F4F4F5}
.rvp-tot{margin-top:14px;margin-left:auto;width:60%}
.rvp-trow{display:flex;justify-content:space-between;font-size:12.5px;color:#52525B;padding:5px 0}
.rvp-due{border-top:1px solid #EFEFF0;margin-top:4px;padding-top:10px;font-size:15px;font-weight:700;color:#007466}
.rvp-sign{margin-top:26px;font-size:11px;color:#A1A1AA;text-align:right;border-top:1px dashed #E4E4E7;padding-top:8px}
.rvdoc-ctl{position:sticky;bottom:0;display:flex;gap:6px;justify-content:center;margin-top:16px}
.rvz{border:1px solid #D4D4D7;background:#fff;border-radius:6px;height:32px;min-width:32px;padding:0 10px;font-size:14px;color:#52525B;cursor:pointer}
.rvz:hover{background:#FAFAFA}

function gkey(p,x){const g=S.gs[p].g;
 if(p==='ub'){const c=cons(x.cons);return g==='status'?x.status:g==='biller'?c.b:x.cons}
 return g==='biller'?x.b:g==='category'?BL[x.b].cat:x.branch}
function glabel(p,k){const g=S.gs[p].g;
 if(g==='biller')return `${avB(k)}<span>${BL[k].n}</span>`;
 if(p==='ub'&&g==='status')return pl(...BST[k]);
 if(p==='ub'&&g==='consumer'){const c=cons(k);return `${avB(c.b)}<span>${esc(c.nick)}</span><span class="subt">${BL[c.b].n}</span>`}
 return `<span>${esc(k)}</span>`}
function grouped(p,items,cols,amtCol,amtFn,toRow,kind){
 if(S.gs[p].g==='none')return items.map(toRow);
 const order=[],map={};items.forEach(x=>{const k=gkey(p,x);if(!map[k]){map[k]=[];order.push(k)}map[k].push(x)});
 const out=[];
 for(const k of order){const list=map[k],id=p+':'+k,closed=S.coll.has(id);
  out.push({grp:1,gid:id,closed,label:glabel(p,k),count:list.length+' '+(p==='ub'?'bill':'account')+(list.length>1?'s':''),total:inr(list.reduce((a,x)=>a+amtFn(x),0)),amtCol});
  if(!closed)list.forEach(x=>out.push(toRow(x)));}
 return out;

 const open=S.drawer.tl, list=open?events:events.slice(0,2);
 const ev=list.map(([t,dt,s],i,a)=>`<div class="mp-e"><div class="mp-ei"><span class="mp-ec ${s==='pend'?'pd':s==='rej'?'rj':''}">${s==='pend'?'':s==='rej'?TX:TICK}</span>${i<a.length-1?'<span class="mp-vl"></span>':''}</div><div><p class="mp-et ${s==='pend'?'pd':''}">${t}</p><p class="mp-ed">${dt}</p></div></div>`).join('');
 return `<p class="mp-h">Timeline</p><div class="mp-card"><div class="mp-tg"><span class="${tag[1]}">${tag[0]}</span><span class="ty">${type}</span></div><div class="mp-st">${st}</div><div class="mp-ev">${ev}${events.length>2?`<p class="mp-sl2" data-a="tl" style="cursor:pointer">${open?'Show less '+CHEVU:'Show all '+CHEVD}</p>`:''}</div></div>`;

function billEvents(b){
 const e=[];
 if(b.status==='paid')e.push(['Paid to '+BL[cons(b.cons).b].n,`on ${b.paidOn} · UTR ${b.utr}`,'done']);
 if(b.payId&&b.status!=='rtp'){const p=pay(b.payId);if(p){if(b.status==='ip')e.push([p.status==='appr'?'Payment approval pending':'Authorisation pending',(p.on===ME?'You':p.on)+' · Utility Wallet','pend']);e.push(['Payment created - By '+p.by,'on '+p.cr,'done'])}}
 if(b.status==='rtp')e.push(['Ready to pay','Create a payment from Ready To Pay › Utility Bills','pend']);
 if(b.status==='rej')e.push(['Rejected - By '+b.rjBy,`on ${b.rjOn} · ${esc(b.rjWhy)}`,'rej']);
 if(b.status==='pr')e.push(['Finance review',(b.on===ME?'Waiting on you':'Waiting on '+b.on),'pend']);
 if(b.rvBy)e.push(['Reviewed - By '+b.rvBy,'on '+b.rvOn,'done']);
 if(b.status==='pa')e.push(['Bill approval',(b.on===ME?'Waiting on you':'Waiting on '+b.on),'pend']);
 if(b.apBy)e.push(['Approved - By '+b.apBy,'on '+b.apOn,'done']);
 e.push(['Bill fetched','on '+b.fetched+' · Think Walnut (BBPS)','done']);
 return e;
}

function payEvents(p){
 const e=[];
 if(p.status==='ok')e.push([p.type==='Utility'?'Payment confirmed by biller':'Amount credited successfully',`on ${p.authOn} · UTR ${p.utr}`,'done']);
 if(p.status==='fail')e.push(['Amount credit failed',`on ${p.authOn} · ${p.why}`,'rej']);
 if(p.status==='proc')e.push(['Processing','Awaiting confirmation from bank','pend']);
 if(p.status==='rej')e.push(['Rejected - By '+p.rjBy,`on ${p.rjOn} · ${esc(p.rjWhy)}`,'rej']);
 if(['ok','fail','proc'].includes(p.status)){e.push([`1st Attempt: ${p.type==='Utility'?'BBPS':'NEFT'}`,'on '+p.authOn,'done']);e.push(['Authorised - By '+p.authBy,'on '+p.authOn,'done'])}
 if(p.status==='auth')e.push(['Authorisation',(p.on===ME?'Waiting on you':'Waiting on '+p.on),'pend']);
 if(p.status==='appr')e.push(['Approval',(p.on===ME?'Waiting on you':'Waiting on '+p.on),'pend']);
 if(p.apBy&&p.status!=='appr')e.push([p.apBy==='Auto approved'?'Auto approved':'Approved - By '+p.apBy,'on '+(p.apOn||p.cr),'done']);
 e.push(['Created - By '+p.by,'on '+p.cr,'done']);
 return e;
}

  b.status='ip';b.payId=pid;rule==='approval'?ap++:au++;});
 S.sel.clear();S.modal=null;
 toast(`${ids.length} payment${ids.length>1?'s':''} created${au?` · ${au} to authorise (Pending On Me)`:''}${ap?` · ${ap} awaiting approval (Pending On Others)`:''}`);
}
function payGo(p){
 if(p.status==='appr'){p.status='auth';p.apBy=ME;p.apOn=nowStr();p.on=ME;toast('Approved · moved to authorisation');return}
 if(p.status==='auth'){const a=acct(p.acct);if(p.amt>a.bal){toast(`Insufficient ${a.name} balance to authorise ${inr(p.amt)}`,1);return}
  a.bal-=p.amt;p.status='proc';p.authBy=ME;p.authOn=nowStr();p.on=null;toast('Authorised · payment processing');
  setTimeout(()=>{p.status='ok';p.utr=(p.type==='Utility'?'BBPS':'UTR')+String(Date.now()).slice(-10);if(p.bill){const b=bill(p.bill);b.status='paid';b.paidOn=p.authOn;b.utr=p.utr}toast(`${esc(p.bene)} paid · moved to All Transactions`);render()},1600);}
}
function payRej(p){p.status='rej';p.rjBy=ME;p.rjOn=nowStr();p.rjWhy='Rejected by approver';p.on=null;if(p.bill){const b=bill(p.bill);b.status='rtp';b.payId=null}toast(p.bill?'Payment rejected · bill returned to Ready To Pay':'Payment rejected')}
function act(a,el){
 const [k,...rest]=a.split(':');const v=rest.join(':');
 S.menu=null;
 switch(k){
  case 'dclose':S.drawer=null;break;
  case 'tl':S.drawer.tl=!S.drawer.tl;break;
  case 'appr':approveBill(bill(v));break;
  case 'rej':rejectBill(bill(v));break;
  case 'paybill':S.modal={kind:'pay',ids:[v]};break;
  case 'pgo':payGo(pay(v));S.sel.delete(v);break;
  case 'prej':payRej(pay(v));S.sel.delete(v);break;
  case 'openbill':S.drawer={kind:'bill',id:v,tab:'d',tl:false};break;
  case 'review':S.review=v;S.revTab='d';S.drawer=null;S.menu=null;go('review');return;
  case 'rvclose':S.review=null;go('ub');return;
  case 'rvreject':{const b=bill(S.review);rejectBill(b);S.review=null;go('ub');return}
  case 'rvsubmit':{const b=bill(S.review);approveBill(b);S.review=null;go('ub');return}
  case 'openpay':S.drawer={kind:'pay',id:v,tab:'d',tl:false};break;
  case 'opencons':if(S.route!=='ca'){S.caTab=cons(v).active?'active':'inactive';go('ca',{});}S.drawer={kind:'cons',id:v,tab:'d',tl:false};break;
  case 'gounpaid':S.uf={cons:v,unpaid:true};S.ubTab='all';go('ub');return;
  case 'gobill':{const b=bill(v);S.ubTab='all';S.uf={cons:null,unpaid:false};go('ub');S.drawer={kind:'bill',id:v,tab:'d',tl:false};break}
  case 'gopay':{const p=pay(v);const r=['appr','auth'].includes(p.status)?(p.on===ME?'pom':'poo'):'all';S.acct[r]=p.acct;if(r==='all')S.allTab=p.status==='rej'?'rej':'all';go(r);S.drawer={kind:'pay',id:v,tab:'d',tl:false};break}
  case 'uf':if(v==='all')S.uf={cons:null,unpaid:false};else S.uf[v]=v==='cons'?null:false;break;
  case 'addcons':S.modal={kind:'add',cat:'Electricity',b:'MS',num:'170012345690',bu:'4637',meter:'Postpaid',conn:'LT',nick:'Chakan plant',branch:'Pune',cc:'Pune Operations',bunit:'Warehousing',mcat:'Utilities – Power',copy:true};break;
  case 'addcopy':S.modal.copy=!S.modal.copy;break;
  case 'copy':{const c=cons(v);c.copy=!c.copy;toast(c.copy?'Bill copy will be fetched':'Bill copy turned off');break}
  case 'cinact':{const c=cons(v);c.active=false;c.inactOn='28 Oct 26';toast(`${esc(c.nick)} marked inactive`);if(S.drawer&&S.drawer.id===v)S.drawer=null;break}
  case 'cact':{const c=cons(v);c.active=true;toast(`${esc(c.nick)} marked active`);if(S.drawer&&S.drawer.id===v)S.drawer=null;break}
  case 'reverify':{const c=cons(v);c.status='verifying';toast('Verification restarted with '+BL[c.b].n);break}
  case 'remind':toast('Reminder sent to '+pay(v).on);break;
  case 'copy-dl':toast('Bill copy downloaded');break;
  case 'fetch':toast('Fetched latest bills from Think Walnut · no new bills');break;
  case 'twconnect':S.modal={kind:'connect',step:1};break;
  case 'fcat':if(v==='clear')S.catSel.clear();else S.catSel.has(v)?S.catSel.delete(v):S.catSel.add(v);S.menu={...S._lastMenu};break;
  case 'fcons-b':{toast('Filtered to '+BL[v].n);S.q.ub=BL[v].n;break}
  case 'ucol':if(v==='reset')S.ucols=new Set(['billno','due','amount','status','pending','fetched']);else S.ucols.has(v)?S.ucols.delete(v):S.ucols.add(v);S.menu={...S._lastMenu};break;
  case 'gs':{const [p,t,val]=v.split(':');S.gs[p][t]=val;S.coll.clear();break}
  case 'toast':toast(v);return;
  case 'menu':case 'fmenu':{const r=el.getBoundingClientRect();const [mk,mid]=k==='fmenu'?['f'+v,'']:[rest[0],rest.slice(1).join(':')];S.menu={k:mk,id:mid,x:Math.min(r.right-220,innerWidth-230),y:r.bottom+4};if(S.menu.x<210&&k==='fmenu')S.menu.x=r.left;S._lastMenu={...S.menu};break}
 }
 render();
}
document.addEventListener('click',e=>{
 const t=e.target;
 // menu item
 const mi=t.closest('[data-mi]');if(mi){e.stopPropagation();const v=mi.dataset.mi;const keep=v.startsWith('fcat:')||v.startsWith('ucol:');act(v,mi);if(!keep&&S.menu)S.menu=null,render();return}
 if(!t.closest('.fmenu')&&S.menu&&!t.closest('[data-a^="menu:"],[data-a^="fmenu:"]')){S.menu=null;render()}
 const sec=t.closest('[data-sec]');if(sec){S.open[sec.dataset.sec]=!S.open[sec.dataset.sec];render();return}
 const nv=t.closest('[data-nav]');if(nv){go(nv.dataset.nav);return}
 if(t.dataset&&t.dataset.m==='bg'){S.modal=null;render();return}
 const m=t.closest('[data-m]:not([data-m="bg"])');if(m){const k=m.dataset.m;
  if(k==='close'){S.modal=null;render();return}
  if(k==='paycreate'){createPayments(S.modal.ids);render();return}
  if(k==='addsave'){const M=S.modal;const err={};if(!M.num)err.num=1;if(M.b==='MS'&&!M.bu)err.bu=1;if(!M.nick)err.nick=1;if(Object.keys(err).length){M.err=err;render();return}
   const id='c'+(CONS.length+1+Math.floor(Math.random()*1000));CONS.push({id,b:M.b,nick:M.nick,num:M.num,bu:M.b==='MS'?M.bu:null,branch:M.branch,status:'verifying',active:true,meter:M.meter,conn:M.conn,copy:M.copy,cc:M.cc,bunit:M.bunit,exp:BL[M.b].cat+' charges',added:'28 Oct 26'});
   S.modal=null;S.caTab='active';S.drawer={kind:'cons',id,tab:'d',tl:false};toast(`Utility vendor added · verifying with ${BL[M.b].n}`);render();return}
  if(k==='c2'){S.modal.step=2;render();setTimeout(()=>{if(S.modal&&S.modal.kind==='connect'){S.modal.step=3;render()}},1400);return}
  if(k==='c1'){S.modal.step=1;render();return}
  if(k==='cdone'){S.modal=null;S.twConnected=true;toast('Utility Wallet connected');render();return}
 }
 const ar=t.closest('[data-ar]');if(ar){const [k,v]=ar.dataset.ar.split(':');S.modal[k]=v;render();return}
 const bk=t.closest('[data-bulk]');if(bk){const k=bk.dataset.bulk,ids=[...S.sel];
  if(k==='clear'){S.sel.clear();render();return}
  if(k==='pay'){S.modal={kind:'pay',ids:ids.filter(i=>bill(i)&&bill(i).status==='rtp')};render();return}
  if(k==='appr'){let n=0;ids.map(bill).forEach(b=>{if((b.status==='pa'||b.status==='pr')&&b.on===ME){approveBill(b);n++}});S.sel.clear();toast(`${n} bill${n>1?'s':''} approved`);render();return}
  if(k==='rej'){ids.map(bill).forEach(b=>{if((b.status==='pa'||b.status==='pr')&&b.on===ME)rejectBill(b)});S.sel.clear();toast(`${ids.length} bill${ids.length>1?'s':''} rejected`);render();return}
  if(k==='pgo'){ids.map(pay).forEach(payGo);S.sel.clear();render();return}
  if(k==='prej'){ids.map(pay).forEach(payRej);S.sel.clear();render();return}
 }
 const a=t.closest('[data-a]');if(a){e.stopPropagation();act(a.dataset.a,a);return}
 const rt=t.closest('[data-rvtab]');if(rt){S.revTab=rt.dataset.rvtab;render();return}
 const dt=t.closest('[data-dtab]');if(dt){S.drawer.tab=dt.dataset.dtab;render();return}
 const tb=t.closest('[data-tab]');if(tb){const [key,val,val2]=tb.dataset.tab.split(':');if(key==='utab'){go(val==='vendors'?'ca':'ub');return}S.sel.clear();S.drawer=null;
  if(key==='acct')S.acct[val]=val2;else if(key==='ub')S.ubTab=val;else if(key==='ca')S.caTab=val;else if(key==='rtp')S.rtpTab=val;else if(key==='all')S.allTab=val;render();return}
 const cd=t.closest('[data-card]');if(cd&&(S.route==='pom'||S.route==='poo')){S.acct[S.route]=cd.dataset.card;S.sel.clear();S.drawer=null;render();return}
 const ch=t.closest('[data-chip]');if(ch){const [p,k]=ch.dataset.chip.split(':');S.f[p][k]=!S.f[p][k];
  if(p==='pom'||p==='poo'){if(k==='appr'&&S.f[p].appr)S.f[p].auth=false;if(k==='auth'&&S.f[p].auth)S.f[p].appr=false}
  if(p==='all'){if(k==='proc'&&S.f.all.proc)S.f.all.fail=false;if(k==='fail'&&S.f.all.fail)S.f.all.proc=false}
  S.sel.clear();render();return}
 const sa=t.closest('[data-selall]');if(sa){const rows=[...document.querySelectorAll('#vBai .tr [data-sel]')].map(x=>x.dataset.sel);const all=rows.every(i=>S.sel.has(i));rows.forEach(i=>all?S.sel.delete(i):S.sel.add(i));render();return}
 const sl=t.closest('[data-sel]');if(sl){const i=sl.dataset.sel;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render();return}
 const gr=t.closest('[data-grp]');if(gr){const id=gr.dataset.grp;S.coll.has(id)?S.coll.delete(id):S.coll.add(id);render();return}
 const row=t.closest('[data-open]');if(row){const [kind,id]=row.dataset.open.split(':');if(kind==='none')return;openDrawer(kind,id);return}
});
document.addEventListener('input',e=>{const q=e.target.dataset.q;if(q){S.q[q]=e.target.value;S.sel.clear();render();return}
 const af=e.target.dataset.af;if(af&&S.modal){S.modal[af]=e.target.value;if(S.modal.err)delete S.modal.err[af];if(af==='cat'){const first=Object.entries(BL).find(([k,x])=>x.cat===e.target.value);if(first)S.modal.b=first[0]}render()}});
document.addEventListener('change',e=>{const af=e.target.dataset.af;if(af&&S.modal&&e.target.tagName==='SELECT'){S.modal[af]=e.target.value;if(af==='cat'){const first=Object.entries(BL).find(([k,x])=>x.cat===e.target.value);if(first)S.modal.b=first[0]}render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.menu)S.menu=null;else if(S.modal)S.modal=null;else if(S.drawer)S.drawer=null;else if(S.sel.size)S.sel.clear();render()}});
render();

</script></body></html>
